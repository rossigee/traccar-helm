replicaCount: 2

deploymentStrategy:
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%
  type: RollingUpdate

mysql:
  image:
    tag: "8.4"
  customStartupProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
  customLivenessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  customReadinessProbe:
    tcpSocket:
      port: 3306
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

redis-ha:
  enabled: true
  # defaults to 3. but we wan't CI to run through in a reasonable time.
  replicas: 1
  haproxy:
    replicas: 1
